name: CI

on:
  push:
    branches: [main]
  pull_request:

# gitleaks-action reads the PR commit list via the API; the default token may lack this scope.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: |
          for f in README.md LICENSE docs/ai.md .env.example; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q "MIT License" LICENSE || { echo "::error::LICENSE is not MIT"; exit 1; }
      - name: No env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "::error::.env committed"; exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI co-authors in commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range=HEAD
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..HEAD"; fi
          found=$(git log --format='%h %an <%ae> / %cn <%ce>%n%B' "$range" \
            | grep -inE 'co-authored-by:.*(claude|anthropic)|claude-session:|generated with \[claude code\]|^[0-9a-f]+ claude |<[^>]*anthropic\.com>' || true)
          if [ -n "$found" ]; then
            echo "::error::AI attribution in commit history"
            echo "$found"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
          TZ: Europe/Kyiv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: pytest on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app_test

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
        env:
          POSTGRES_PASSWORD: ci-build-only
          SESSION_SECRET: ci-build-only
